<!DOCTYPE html>
<html>
<head>
    <title>Admin Dashboard</title>

    <!-- Bootstrap -->
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">

<style>

.sidebar{
    height:100vh;
    background:#343a40;
    color:white;
    padding:20px;
}

.sidebar a{
    display:block;
    color:white;
    text-decoration:none;
    padding:10px;
}

.sidebar a:hover{
    background:gray;
}

.card{
    text-align:center;
    padding:20px;
}

</style>
</head>

<body>

<div class="container-fluid">

<div class="row">

<!-- Sidebar -->

<div class="col-md-2 sidebar">

<h3>Dashboard</h3>

<a href="#">Home</a>
<a href="#">Students</a>
<a href="#">Courses</a>
<a href="#">Exams</a>
<a href="#">Results</a>

</div>


<!-- Main Content -->

<div class="col-md-10 p-4">

<h2>College Admin Dashboard</h2>

<div class="row mt-4">

<div class="col-md-3">
<div class="card bg-primary text-white">
<h4>500</h4>
<p>Students</p>
</div>
</div>


<div class="col-md-3">
<div class="card bg-success text-white">
<h4>20</h4>
<p>Courses</p>
</div>
</div>


<div class="col-md-3">
<div class="card bg-warning text-white">
<h4>15</h4>
<p>Exams</p>
</div>
</div>


<div class="col-md-3">
<div class="card bg-danger text-white">
<h4>450</h4>
<p>Results</p>
</div>
</div>

</div>

</div>

</div>

</div>

</body>
</html>
